name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo bash scripts/setup-linux.sh
      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.arch }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast -- --skip hackernews::client
      - name: Validate packaging
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate desktop entry
        if: runner.os == 'Linux'
        run: desktop-file-validate packaging/linux/dev.aether.Aether.desktop
      - name: Package
        run: python3 scripts/build.py
      - name: Package Debian installer
        if: runner.os == 'Linux'
        run: python3 scripts/build.py --format deb
      - uses: actions/upload-artifact@v4
        with:
          name: Aether-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows-check:
    runs-on: windows-2025
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain=$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component clippy
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --locked --workspace
      - name: Keep LF in test repos
        run: git config --global core.autocrlf false
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast -- --skip hackernews::client
