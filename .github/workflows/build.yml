name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*', 'alpha-*', 'beta-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo bash scripts/setup-linux.sh
      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.arch }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast -- --skip hackernews::client
      - name: Backtrace test abort
        if: failure() && runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get install -y gdb >/dev/null
          for bin in $(find target/debug/deps -maxdepth 1 -type f -executable -name 'aether-*' ! -name '*.so'); do
            for try in 1 2 3 4 5 6; do
              gdb -q -batch -ex 'set pagination off' -ex run -ex bt -ex 'thread apply all bt 25' \
                --args "$bin" --skip hackernews::client > /tmp/gdb.log 2>&1
              if grep -q SIGABRT /tmp/gdb.log; then
                grep -vE '^test .* \.\.\. ok$|^\[New Thread|^\[Thread' /tmp/gdb.log
                exit 0
              fi
            done
          done
          echo "no abort reproduced in 6 tries"
      - name: Validate packaging
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate desktop entry
        if: runner.os == 'Linux'
        run: desktop-file-validate packaging/linux/dev.aether.Aether.desktop
      # Release tags only: secrets are never exposed to pull request builds.
      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::APPLE_CERTIFICATE_P12 not set; macOS build stays ad-hoc signed and not notarized"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')
          [ -n "$identity" ] || { echo "::error::No Developer ID Application certificate in APPLE_CERTIFICATE_P12"; exit 1; }
          xcrun notarytool store-credentials aether-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_PROFILE=aether-notary" >> "$GITHUB_ENV"
      - name: Package
        run: python3 scripts/build.py
      - name: Package Debian installer
        if: runner.os == 'Linux'
        env:
          AETHER_MAINTAINER: ${{ vars.AETHER_MAINTAINER }}
        run: python3 scripts/build.py --format deb
      - uses: actions/upload-artifact@v4
        with:
          name: Aether-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain=$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component clippy
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --locked --workspace
      - name: Keep LF in test repos
        run: git config --global core.autocrlf false
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast -- --skip hackernews::client
      - name: Package
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Aether-windows-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag)
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
