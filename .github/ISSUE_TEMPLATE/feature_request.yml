name: Feature request
description: Suggest an idea or improvement for Aether.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like Aether to handle it?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
