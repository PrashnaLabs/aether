<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aether · agent chat prototype</title>
<style>
:root{
  --bg:#0d0d0f;--side:#111113;--panel:#151518;--raised:#1b1b1f;--hover:#212126;--line:#25252a;--line2:#33333a;
  --text:#ececef;--dim:#a3a3aa;--muted:#7c7c84;--faint:#55555c;
  --green:#3fb950;--green-bg:rgba(63,185,80,.12);--red:#f85149;--red-bg:rgba(248,81,73,.12);
  --amber:#f5a524;--amber-bg:rgba(245,165,36,.12);--blue:#58a6ff;--blue-bg:rgba(88,166,255,.12);
  --violet:#b18cff;--violet-bg:rgba(177,140,255,.10);
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:13px;height:13px}.i.rot{transform:rotate(90deg)}
.mono,code,pre{font-family:var(--mono)}
.sp{flex:1}.dim{color:var(--muted)}.sep{color:var(--faint);margin:0 2px}
.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.blue{color:var(--blue)}.violet{color:var(--violet)}
kbd{font:11px var(--mono);padding:1px 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;color:var(--dim)}

/* prototype bar */
#bar{position:fixed;top:0;left:0;right:0;height:84px;background:#08080a;border-bottom:1px solid var(--line);z-index:10;padding:8px 14px;display:flex;flex-direction:column;gap:6px}
#bar .row{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
#bar .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px;white-space:nowrap}
.scn{white-space:nowrap;padding:3px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--dim);font-size:12.5px}
.scn:hover{background:var(--hover);color:var(--text)}
.scn.on{background:var(--text);color:#000;border-color:var(--text)}
.scn.play{border-color:var(--green);color:var(--green);display:flex;gap:5px;align-items:center}
.scn.play.on{background:var(--green);color:#000}
#note{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#note b{color:var(--text);font-weight:600}

/* app frame */
#app{position:fixed;top:84px;left:0;right:0;bottom:0;display:grid;grid-template-columns:280px 1fr;background:var(--bg)}
#side{background:var(--side);border-right:1px solid var(--line);padding:12px 10px;overflow:auto;font-size:13.5px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:2px 6px 12px}
.brand .lg{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#fb7185,#f59e0b);display:grid;place-items:center;font-size:13px}
.sh{font-size:12px;color:var(--muted);padding:12px 6px 6px}
.si{padding:8px 10px;border-radius:8px;margin-bottom:2px;cursor:default}
.si:hover{background:var(--hover)}
.si.cur{background:var(--raised)}
.si .top{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.si .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0}
.si .ag{font-size:11px;padding:0 5px;border-radius:4px;background:var(--line);color:var(--dim)}
.st{display:flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}.dot.blue{background:var(--blue)}.dot.green{background:var(--green)}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

#main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
#head{height:44px;display:flex;align-items:center;gap:8px;padding:0 18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--dim);flex:none}
#head b{color:var(--text);font-weight:500}
#head .vp{font-size:10.5px;font-weight:700;background:#16352a;color:#5fd3a0;border-radius:4px;padding:1px 4px}
#scroll{flex:1;overflow:auto;min-height:0}
#chat{max-width:780px;margin:0 auto;padding:24px 20px 40px}
#dock{flex:none;max-width:780px;width:100%;margin:0 auto;padding:0 20px 12px}

/* messages */
.user{display:flex;flex-direction:column;align-items:flex-end;margin:10px 0 22px}
.bubble{background:var(--raised);border:1px solid var(--line);padding:9px 14px;border-radius:14px;max-width:80%}
.time{font-size:11.5px;color:var(--faint);margin-top:4px}
.reply{margin-bottom:26px}
.blk{margin:1px 0}
.row{display:flex;align-items:center;gap:8px;min-height:30px;padding:3px 8px;margin:0 -8px;border-radius:7px;cursor:pointer;color:var(--dim)}
.row:hover{background:var(--panel)}
.row .ttl{color:var(--text);font-weight:500;white-space:nowrap}
.row .arg{font-family:var(--mono);font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .meta{display:flex;align-items:center;gap:8px;margin-left:auto;padding-left:10px;font-size:12px;color:var(--muted);white-space:nowrap}
.row .chev{color:var(--faint)}
.row.running .ki{color:var(--blue)}
.row.failed .ki{color:var(--red)}
.row.waiting .ki,.row.denied .ki{color:var(--amber)}
.row.bg .ki{color:var(--blue)}
.add{color:var(--green);font-family:var(--mono);font-size:12px}.del{color:var(--red);font-family:var(--mono);font-size:12px}
.pill{font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--line);color:var(--dim);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill.red{background:var(--red-bg);color:var(--red)}.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.green{background:var(--green-bg);color:var(--green)}.pill.blue{background:var(--blue-bg);color:var(--blue)}.pill.violet{background:var(--violet-bg);color:var(--violet)}
.errline{font-family:var(--mono);font-size:12px;color:var(--red);padding:0 0 4px 31px;margin-top:-2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{margin:4px 0 8px 23px}
.spin{width:13px;height:13px;border-radius:50%;border:1.8px solid rgba(88,166,255,.25);border-top-color:var(--blue);animation:spin .8s linear infinite;display:inline-block;flex:none}
.spin.sm{width:11px;height:11px}
.spin.amber{border-color:rgba(245,165,36,.25);border-top-color:var(--amber)}
.spin.violet{border-color:rgba(177,140,255,.25);border-top-color:var(--violet)}
@keyframes spin{to{transform:rotate(360deg)}}
.caret{display:inline-block;width:7px;height:15px;background:var(--text);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tm{font-variant-numeric:tabular-nums}

/* thought */
.thought .row .ki{color:var(--muted)}
.thought .prev{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:13px}
.thought.live .row .ttl{background:linear-gradient(90deg,var(--muted),var(--text),var(--muted));background-size:200% 100%;-webkit-background-clip:text;color:transparent;animation:shimmer 2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.tbody{margin:2px 0 8px 23px;padding:2px 0 2px 14px;border-left:2px solid var(--line2);color:var(--dim);font-size:13.5px}
.tbody p{margin:4px 0}

/* markdown */
.md{line-height:1.65;margin:8px 0}
.md p{margin:8px 0}
.md h3{font-size:17px;margin:18px 0 6px}.md h4{font-size:15px;margin:14px 0 4px}
.md ul,.md ol{margin:6px 0;padding-left:22px}.md li{margin:3px 0}
code.ic{font-size:12.5px;background:var(--raised);border:1px solid var(--line);padding:0 5px;border-radius:5px}
code.ic.file{color:var(--blue);cursor:pointer}
.md blockquote{margin:8px 0;padding-left:12px;border-left:3px solid var(--line2);color:var(--dim)}
.md table{border-collapse:collapse;margin:10px 0;font-size:13px;width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.md th{background:var(--panel);font-weight:600}
.cb{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0;background:#0a0a0c}
.cb-h{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--panel)}
.cb pre{margin:0;padding:10px 12px;font-size:12.5px;line-height:1.6;overflow:auto;max-height:340px}
.ghost{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:6px;color:var(--muted);font-size:12px}
.ghost:hover{background:var(--hover);color:var(--text)}
/* syntax */
.hk{color:#ff7b72}.hs{color:#a5d6ff}.hc{color:#6e7681;font-style:italic}.hf{color:#d2a8ff}.hn{color:#79c0ff}.ht{color:#7ee787}.hty{color:#ffa657}.hp{color:#79c0ff}.hv{color:#ffa657}

/* terminal */
.term{border:1px solid var(--line);border-radius:9px;background:#09090b;overflow:hidden}
.term-h{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font:12px var(--mono);color:var(--dim)}
.term-h .cwd{margin-left:auto;color:var(--faint)}
.term pre{margin:0;padding:8px 10px;font-size:12px;line-height:1.55;max-height:220px;overflow:auto;color:#c9c9cf;white-space:pre-wrap}
.term .ok{color:var(--green)}.term .er{color:var(--red)}.term .wa{color:var(--amber)}.term .ac{color:var(--blue)}
.term-f{display:flex;gap:10px;padding:5px 10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}

/* diff */
.diff{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#0a0a0c;margin:4px 0}
.diff-h{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;border-bottom:1px solid var(--line);font-size:12.5px;background:var(--panel)}
.diff-h .path{font-family:var(--mono);color:var(--dim)}.diff-h .path b{color:var(--text);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg span{padding:1px 8px;font-size:11.5px;color:var(--muted)}.seg span.on{background:var(--hover);color:var(--text)}
.diff-b{font:12px/1.6 var(--mono);overflow:auto;max-height:420px}
.dl{display:grid;grid-template-columns:38px 38px 16px 1fr;white-space:pre}
.dl .ln{color:var(--faint);text-align:right;padding-right:8px;user-select:none}
.dl .sg{color:var(--faint);user-select:none}
.dl.a{background:rgba(63,185,80,.10)}.dl.a .sg{color:var(--green)}
.dl.d{background:rgba(248,81,73,.10)}.dl.d .sg{color:var(--red)}
.dl.a mark{background:rgba(63,185,80,.32);color:inherit;border-radius:2px}
.dl.d mark{background:rgba(248,81,73,.32);color:inherit;border-radius:2px}
.dh{display:flex;align-items:center;gap:8px;padding:3px 10px;background:var(--blue-bg);color:var(--blue);font:11.5px var(--sans)}
.dh .dim{font-family:var(--mono)}
.dx{padding:2px 10px 2px 46px;color:var(--muted);font:11.5px var(--sans);background:var(--panel);cursor:pointer}
.dx:hover{color:var(--text)}
.ds{display:grid;grid-template-columns:1fr 1fr}
.ds>div{display:grid;grid-template-columns:38px 1fr;white-space:pre;min-height:19px;overflow:hidden}
.ds>div:nth-child(odd){border-right:1px solid var(--line)}
.ds .ln{color:var(--faint);text-align:right;padding-right:8px}
.ds .a{background:rgba(63,185,80,.10)}.ds .d{background:rgba(248,81,73,.10)}.ds .e{background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(255,255,255,.025) 5px 10px)}
.ds .a mark{background:rgba(63,185,80,.32);color:inherit}.ds .d mark{background:rgba(248,81,73,.32);color:inherit}

/* read preview */
.peek{border:1px solid var(--line);border-radius:9px;overflow:hidden;font:12px/1.6 var(--mono);background:#0a0a0c}
.peek .pl{display:grid;grid-template-columns:38px 1fr;white-space:pre}.peek .ln{color:var(--faint);text-align:right;padding-right:8px}
.peek .more{padding:3px 10px;color:var(--muted);font:11.5px var(--sans);border-top:1px solid var(--line);background:var(--panel)}
.matches div{font:12px/1.7 var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.matches b{color:var(--blue);font-weight:400}

/* subagent */
.agent{border:1px solid var(--line);border-radius:11px;margin:8px 0;background:var(--panel);overflow:hidden;position:relative}
.agent::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--violet)}
.agent.waiting::before{background:var(--amber)}.agent.failed::before{background:var(--red)}.agent.done::before{background:var(--green);opacity:.6}.agent.stopped::before{background:var(--faint)}
.agent-h{display:flex;align-items:center;gap:8px;padding:9px 12px 9px 14px;cursor:pointer}
.agent-h:hover{background:var(--raised)}
.agent-h .nm{font-weight:600}
.agent-h .desc{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.agent-h .meta{display:flex;gap:8px;align-items:center;margin-left:auto;padding-left:10px;font-size:12px;color:var(--muted);white-space:nowrap}
.agent-now{display:flex;align-items:center;gap:8px;padding:0 12px 9px 37px;font-size:12.5px;color:var(--dim);margin-top:-3px}
.agent-now .arg{font-family:var(--mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-in{border-top:1px solid var(--line);padding:6px 12px 8px 14px;background:var(--bg)}
.agent-in .prompt{font-size:12.5px;color:var(--muted);padding:4px 0 6px;border-bottom:1px dashed var(--line);margin-bottom:4px}
.agent-in .row{min-height:26px;font-size:13px}
.agent-in .more{font-size:12px;color:var(--muted);padding:2px 0 2px 23px;cursor:pointer}
.agent .res{padding:0 14px 10px 37px;font-size:13.5px;color:var(--dim)}
.agent .res p{margin:4px 0}
.agent .aerr{padding:0 14px 10px 37px;font:12px var(--mono);color:var(--red)}
.agent .card{margin:8px 12px 12px 14px}

/* cards */
.card{border:1px solid var(--line2);border-radius:12px;background:var(--panel);padding:12px 14px;margin:10px 0}
.card.perm{border-color:rgba(245,165,36,.45);box-shadow:0 0 0 3px rgba(245,165,36,.06)}
.card.ask{border-color:rgba(88,166,255,.45);box-shadow:0 0 0 3px rgba(88,166,255,.06)}
.card.fatal{border-color:rgba(248,81,73,.5);background:linear-gradient(var(--red-bg),var(--red-bg)),var(--panel)}
.card.stall{border-color:rgba(245,165,36,.4)}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card-h b{font-weight:600}
.card .src{font-size:12px;color:var(--muted)}
.card pre.cmd{margin:6px 0;padding:10px 12px;border-radius:8px;background:#09090b;border:1px solid var(--line);font-size:12.5px;line-height:1.6;white-space:pre-wrap;color:#e6e6ea}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px;margin:6px 0}
.kv span{color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:7px;border:1px solid var(--line2);font-size:12.5px;background:var(--raised)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--text);color:#000;border-color:var(--text)}
.btn.primary kbd{color:#333;border-color:#999}
.btn.danger{color:var(--red);border-color:rgba(248,81,73,.4)}
.btn code{font-size:11.5px;background:var(--line);padding:0 4px;border-radius:4px}
.note-in{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:5px 9px;font-size:12.5px;color:var(--muted)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:5px 0;cursor:pointer}
.opt:hover{background:var(--raised)}
.opt.on{border-color:var(--blue);background:var(--blue-bg)}
.opt .box{width:15px;height:15px;border:1.5px solid var(--line2);border-radius:50%;margin-top:3px;flex:none}
.opt.multi .box{border-radius:4px}
.opt.on .box{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 3px var(--panel)}
.opt .d{font-size:12.5px;color:var(--muted)}
.qstep{font-size:12px;color:var(--muted);margin-left:auto}

/* notices */
.note{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:5px 0}
.note b{color:var(--dim);font-weight:500}
.note.warn{color:var(--amber)}.note.warn b{color:var(--amber)}
.note.bad{color:var(--red)}.note.bad b{color:var(--red)}
.note.ok .i{color:var(--green)}
.note .ghost{padding:1px 6px}

.wake{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-size:12.5px;color:var(--blue)}
.wake::after{content:"";flex:1;height:1px;background:var(--line)}
.steer{display:flex;align-items:center;gap:8px;margin:8px 0;padding:6px 10px;border-radius:9px;background:var(--raised);border:1px dashed var(--line2);font-size:13px}
.boot div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);padding:3px 0}
.boot .mono{font-size:12px;color:var(--faint)}

/* live status line */
.live{display:flex;align-items:center;gap:7px;margin-top:10px;padding:7px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--dim)}
.live b{color:var(--text);font-weight:500}
.live.amber{border-color:rgba(245,165,36,.4);background:var(--amber-bg)}.live.amber b{color:var(--amber)}
.live.blue{border-color:rgba(88,166,255,.35)}
.hb{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.hb i{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.2s infinite}
.hb.q i{background:var(--muted);animation:none}
.hb.w{color:var(--amber)}.hb.w i{background:var(--amber)}
.esc{color:var(--faint);margin-left:8px}

/* group, footer, changes */
.group{display:flex;align-items:center;gap:8px;padding:6px 10px;margin:0 -10px 6px;border-radius:8px;cursor:pointer;color:var(--dim);font-size:13.5px}
.group:hover{background:var(--panel)}
.group b{color:var(--text);font-weight:500}
.foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.foot .ghost{padding:2px 5px}
.changes{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin:12px 0 4px}
.ch-h{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);font-size:13px}
.ch-f{display:flex;align-items:center;gap:8px;padding:5px 12px;border-top:1px solid var(--line);font-size:12.5px;cursor:pointer}
.ch-f:hover{background:var(--panel)}
.ch-f .path{font-family:var(--mono);color:var(--muted)}.ch-f .path b{color:var(--text);font-weight:400}
.fs{font:10.5px var(--mono);width:16px;text-align:center;border-radius:3px}
.fs.M{color:var(--amber)}.fs.A{color:var(--green)}.fs.D{color:var(--red)}

/* dock */
.tray{border:1px solid var(--line);border-bottom:0;border-radius:11px 11px 0 0;background:var(--panel);margin:0 10px;font-size:13px}
.tray+.tray{border-radius:0;border-top:1px solid var(--line)}
.tray-h{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;color:var(--dim)}
.tray-h b{color:var(--text);font-weight:500}
.tray-h .cur{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prog{width:60px;height:4px;border-radius:2px;background:var(--line2);overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--green)}
.tray-b{padding:2px 12px 8px;border-top:1px solid var(--line)}
.todo{display:flex;align-items:center;gap:9px;padding:3px 0;color:var(--dim)}
.todo.done{color:var(--faint);text-decoration:line-through}.todo.done .i{color:var(--green)}
.todo.active{color:var(--text)}
.circ{width:13px;height:13px;border:1.5px solid var(--line2);border-radius:50%;flex:none}
.bgi{display:flex;align-items:center;gap:9px;padding:5px 0}
.bgi .arg{font-family:var(--mono);font-size:12.5px}
.bgi .ghost{padding:2px 6px}
.composer{border:1px solid var(--line2);border-radius:14px;background:var(--panel);padding:10px 12px 8px;position:relative}
.composer.waiting{border-color:rgba(245,165,36,.4)}
.composer.dead{opacity:.85}
.ta{min-height:42px;padding:2px 4px;font-size:14px}
.ta.ph{color:var(--faint)}
.cbar{display:flex;align-items:center;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);padding:2px 7px;border-radius:6px}
.chip:hover{background:var(--hover)}
.ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.send{width:30px;height:30px;border-radius:50%;background:var(--text);color:#000;display:grid;place-items:center}
.send.off{opacity:.3}
.stopb{width:30px;height:30px;border-radius:50%;background:var(--text);color:#000;display:grid;place-items:center}
.stopb .i{fill:#000;stroke:none}
.queued{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 8px;margin:-2px -4px 6px;border-radius:8px;background:var(--raised);color:var(--dim)}
.queued b{color:var(--text);font-weight:400}
.cfoot{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);padding:6px 14px 0}
.dead-bar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--red);padding:2px 4px 8px}

/* hero */
.hero{text-align:center;padding:60px 0 10px}
.hero .lg{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#fb7185,#f59e0b);display:inline-grid;place-items:center;font-size:24px}
.hero h2{margin:14px 0 4px;font-weight:600}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:26px;text-align:left}
.ac{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--panel);cursor:pointer}
.ac:hover{border-color:var(--line2)}
.ac.on{border-color:var(--text)}
.ac .n{display:flex;align-items:center;gap:7px;font-weight:600}
.ac .v{font:11.5px var(--mono);color:var(--faint);margin-left:auto;font-weight:400}
.ac .s{font-size:12.5px;margin:4px 0 6px;display:flex;gap:6px;align-items:center}
.caps{display:flex;flex-wrap:wrap;gap:4px}
.caps span{font-size:10.5px;padding:0 5px;border-radius:4px;background:var(--line);color:var(--muted)}
.caps span.no{text-decoration:line-through;opacity:.5}
</style>

<body>
<div id="bar">
  <div class="row" id="scns"></div>
  <div id="note"></div>
</div>
<div id="app">
  <aside id="side"></aside>
  <section id="main">
    <div id="head"></div>
    <div id="scroll"><div id="chat"></div></div>
    <div id="dock"></div>
  </section>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I={
term:'<path d="M4 17l6-6-6-6"/><path d="M12 19h8"/>',
file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
filePlus:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15h6"/>',
files:'<path d="M15 2H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><path d="M15 2v5h5M4 7v13a2 2 0 0 0 2 2h10"/>',
pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',

bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13v1M15 13v1"/>',
bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
check:'<path d="M20 6L9 17l-5-5"/>',
x:'<path d="M18 6L6 18M6 6l12 12"/>',
shield:'<path d="M12 3L4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/>',
shieldx:'<path d="M12 3L4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="M10 10l4 4M14 10l-4 4"/>',
alert:'<path d="M12 3L2 20h20z"/><path d="M12 10v4M12 17h.01"/>',
refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',
zap:'<path d="M13 2L3 14h9l-1 8 10-12h-9z"/>',
list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
swap:'<path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',
copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
chev:'<path d="M9 6l6 6-6 6"/>',
up:'<path d="M12 19V5M5 12l7-7 7 7"/>',
clip:'<path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/>',
folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
branch:'<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-6 3-12 7"/>',
pulse:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
help:'<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4M12 17h.01"/>',
book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/>',
plug:'<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/>',
retry:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
play:'<path d="M7 4l13 8-13 8z"/>',
sparkle:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
external:'<path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>',
circle:'<circle cx="12" cy="12" r="8"/>',
};
const icon=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24">${I[n]||I.circle}</svg>`;
const now=()=>Date.now();
const ago=s=>now()-s*1000;
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));if(s<60)return s+'s';const m=Math.floor(s/60);if(m<60)return m+'m '+String(s%60).padStart(2,'0')+'s';return Math.floor(m/60)+'h '+(m%60)+'m'}
const fsec=s=>s<1?(s*1000|0)+'ms':fmt(s*1000);

/* syntax highlight */
const KW=/^(import|from|export|default|function|return|const|let|var|if|else|for|while|await|async|type|interface|new|class|extends|true|false|null|undefined)$/;
const SHC=/^(cd|ls|cat|git|pnpm|npm|npx|find|grep|sed|head|echo|rg|tsc|node|wc|vite|exec|add)$/;
function hl(code,lang){
  if(!code)return '';
  if(lang==='text')return esc(code);
  const re=lang==='css'?/(\/\*[\s\S]*?\*\/)|("[^"]*"|'[^']*')|(--[\w-]+|#[0-9a-fA-F]{3,8}\b)|(\b\d+(?:\.\d+)?(?:px|rem|em|%|ms|s|vh|vw|fr)?\b)|([a-z-]+)(?=\s*:)/g
    :lang==='sh'?/(#.*$)|("[^"]*"|'[^']*')|(\s--?[\w-]+)|(\b\d+\b)|([\w.-]+)/gm
    :/(\/\/.*$|\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`[^`]*`)|(<\/?[A-Za-z][\w.]*)|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_$][\w$]*\b)/gm;
  let out='',i=0,m;
  while((m=re.exec(code))){
    if(m[0]===''){re.lastIndex++;continue}
    out+=esc(code.slice(i,m.index));i=re.lastIndex;
    const t=m[0];let c='';
    if(m[1])c='c';else if(m[2])c='s';else if(m[3])c=lang==='css'?'v':lang==='sh'?'n':'t';else if(m[4])c='n';
    else if(m[5]){
      if(lang==='css')c='p';
      else if(lang==='sh')c=SHC.test(t)?'f':'';
      else c=KW.test(t)?'k':code[i]==='('?'f':/^[A-Z]/.test(t)?'ty':'';
    }
    out+=c?`<span class="h${c}">${esc(t)}</span>`:esc(t);
  }
  return out+esc(code.slice(i));
}
const LANG={tsx:'js',ts:'js',js:'js',jsx:'js',css:'css',sh:'sh',bash:'sh',shell:'sh'};

/* mini markdown */
function inl(s){
  return esc(s)
    .replace(/`([^`]+)`/g,(m,c)=>`<code class="ic${/\.(tsx?|css|md|json)$/.test(c)?' file':''}">${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
}
function codeBlock(code,lang,open){
  return `<div class="cb"><div class="cb-h"><span>${esc(lang)}</span><span class="sp"></span><button class="ghost">${icon('copy','sm')} Copy</button></div><pre><code>${hl(code,LANG[lang]||'text')}${open?'<span class="caret"></span>':''}</code></pre></div>`;
}
function md(src,live){
  const L=src.split('\n');let out='',i=0;
  const block=/^(```|#{1,3} |\s*[-*] |\d+\. |\||> )/;
  while(i<L.length){
    const l=L[i];
    if(l.startsWith('```')){const lang=l.slice(3).trim()||'text';const buf=[];i++;while(i<L.length&&!L[i].startsWith('```')){buf.push(L[i]);i++}const closed=i<L.length;i++;out+=codeBlock(buf.join('\n'),lang,live&&!closed);continue}
    if(/^#{1,3} /.test(l)){const n=l.match(/^#+/)[0].length;out+=`<h${n+2}>${inl(l.slice(n+1))}</h${n+2}>`;i++;continue}
    if(/^\s*[-*] /.test(l)){out+='<ul>';while(i<L.length&&/^\s*[-*] /.test(L[i])){out+=`<li>${inl(L[i].replace(/^\s*[-*] /,''))}</li>`;i++}out+='</ul>';continue}
    if(/^\d+\. /.test(l)){out+='<ol>';while(i<L.length&&/^\d+\. /.test(L[i])){out+=`<li>${inl(L[i].replace(/^\d+\. /,''))}</li>`;i++}out+='</ol>';continue}
    if(l.startsWith('|')){const rows=[];while(i<L.length&&L[i].startsWith('|')){rows.push(L[i]);i++}
      const cells=r=>r.split('|').slice(1,-1).map(c=>c.trim());
      out+=`<table><thead><tr>${cells(rows[0]).map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(2).map(r=>`<tr>${cells(r).map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;continue}
    if(l.startsWith('> ')){out+=`<blockquote>${inl(l.slice(2))}</blockquote>`;i++;continue}
    if(!l.trim()){i++;continue}
    const p=[];while(i<L.length&&L[i].trim()&&!block.test(L[i])){p.push(L[i]);i++}
    out+=`<p>${inl(p.join(' '))}</p>`;
  }
  return out;
}

/* diff */
function wordMark(a,b){
  const x=a.c,y=b.c;let p=0;while(p<x.length&&p<y.length&&x[p]===y[p])p++;
  let s=0;while(s<x.length-p&&s<y.length-p&&x[x.length-1-s]===y[y.length-1-s])s++;
  if(p+s<4)return;a.w=[p,x.length-s];b.w=[p,y.length-s];
}
function codeOf(op,lang){
  if(!op||op.c===undefined)return '';
  if(!op.w)return hl(op.c,lang);
  const[a,b]=op.w;return hl(op.c.slice(0,a),lang)+`<mark>${hl(op.c.slice(a,b),lang)}</mark>`+hl(op.c.slice(b),lang);
}
function parseDiff(lines){
  const ops=[];let o=0,n=0;
  for(const l of lines){
    if(l.startsWith('@@')){const m=/@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@\s?(.*)/.exec(l);o=+m[1];n=+m[2];ops.push({t:'h',o,n,ctx:m[3]});continue}
    if(l.startsWith('~')){ops.push({t:'~',c:l.slice(1)});continue}
    const s=l[0],c=l.slice(1);
    if(s==='-')ops.push({t:'-',o:o++,c});else if(s==='+')ops.push({t:'+',n:n++,c});else ops.push({t:' ',o:o++,n:n++,c});
  }
  for(let i=0;i<ops.length;i++){
    if(ops[i].t!=='-')continue;let j=i;while(j<ops.length&&ops[j].t==='-')j++;let k=j;while(k<ops.length&&ops[k].t==='+')k++;
    for(let q=0;q<Math.min(j-i,k-j);q++)wordMark(ops[i+q],ops[j+q]);i=k-1;
  }
  return ops;
}
function diffView(d,id,live){
  const split=SPLIT.has(id);const lang=LANG[d.lang]||'text';const ops=parseDiff(d.lines);
  const add=ops.filter(o=>o.t==='+').length,del=ops.filter(o=>o.t==='-').length;
  const dir=d.path.includes('/')?d.path.slice(0,d.path.lastIndexOf('/')+1):'',name=d.path.slice(dir.length);
  let rows='';
  const hunk=o=>`<div class="dh">${icon('chev','sm')} Line ${o.n}${o.ctx?` <span class="dim">· ${esc(o.ctx)}</span>`:''}</div>`;
  const gap=o=>`<div class="dx">↕ ${esc(o.c)}</div>`;
  if(!split){
    for(const o of ops){
      if(o.t==='h'){rows+=hunk(o);continue}if(o.t==='~'){rows+=gap(o);continue}
      const cls=o.t==='+'?'a':o.t==='-'?'d':'';
      rows+=`<div class="dl ${cls}"><span class="ln">${o.o??''}</span><span class="ln">${o.n??''}</span><span class="sg">${o.t===' '?'':o.t==='-'?'−':'+'}</span><span>${codeOf(o,lang)}</span></div>`;
    }
  }else{
    for(let i=0;i<ops.length;i++){
      const o=ops[i];
      if(o.t==='h'){rows+=hunk(o);continue}if(o.t==='~'){rows+=gap(o);continue}
      if(o.t===' '){rows+=`<div class="ds"><div><span class="ln">${o.o}</span><span>${codeOf(o,lang)}</span></div><div><span class="ln">${o.n}</span><span>${codeOf(o,lang)}</span></div></div>`;continue}
      let j=i;while(j<ops.length&&ops[j].t==='-')j++;let k=j;while(k<ops.length&&ops[k].t==='+')k++;
      const L=ops.slice(i,j),R=ops.slice(j,k);
      for(let q=0;q<Math.max(L.length,R.length);q++){
        const l=L[q],r=R[q];
        rows+=`<div class="ds"><div class="${l?'d':'e'}"><span class="ln">${l?l.o:''}</span><span>${codeOf(l,lang)}</span></div><div class="${r?'a':'e'}"><span class="ln">${r?r.n:''}</span><span>${codeOf(r,lang)}</span></div></div>`;
      }
      i=k-1;
    }
  }
  if(live)rows+=`<div class="dl a"><span class="ln"></span><span class="ln"></span><span class="sg"></span><span><span class="caret"></span></span></div>`;
  return `<div class="diff"><div class="diff-h">${icon('file','sm')}<span class="path">${esc(dir)}<b>${esc(name)}</b></span>${d.isNew?'<span class="pill green">new</span>':''}<span class="add">+${add}</span><span class="del">−${del}</span><span class="sp"></span><span class="seg" data-split="${id}"><span class="${split?'':'on'}">Unified</span><span class="${split?'on':''}">Split</span></span><button class="ghost">${icon('external','sm')} Open</button></div><div class="diff-b">${rows}</div></div>`;
}

/* state */
let S,SEQ=0,PLAY=0,ANSWER=null;
const OPEN=new Set(),SPLIT=new Set(),CLOSED=new Set();
const nid=p=>p+(++SEQ);
const U=(text,time='8:13 AM')=>({role:'user',text,time});
const TH=(text,secs,live)=>({type:'thought',id:nid('th'),text,secs,live,since:live?ago(secs):0});
const TX=(text,live)=>({type:'text',id:nid('tx'),text,live});
const TL=(kind,title,arg,o={})=>({type:'tool',id:nid('t'),kind,title,arg,status:'done',secs:0.4,...o});
const AG=o=>({type:'agent',id:nid('a'),...o});
const NT=(kind,ic,html,o={})=>({type:'note',id:nid('n'),kind,ic,html,...o});

/* render */
const KI={cmd:'term',read:'file',edit:'pencil',write:'filePlus',search:'search',web:'globe',mcp:'plug',skill:'book',task:'bot'};
function statusMeta(t){
  switch(t.status){
    case 'running':return `<span class="spin sm"></span><span class="tm" data-since="${t.since}"></span>`;
    case 'bg':return `<span class="pill blue"><span class="dot blue pulse"></span>Background</span><span class="tm" data-since="${t.since}"></span>`;
    case 'waiting':return `<span class="pill amber">${icon('shield','sm')}Needs approval</span><span class="tm amber" data-since="${t.since}"></span>`;
    case 'failed':return `<span class="pill red">${t.exit!=null?'Exit '+t.exit:'Failed'}</span><span>${fsec(t.secs)}</span>`;
    case 'denied':return `<span class="pill amber">${icon('shieldx','sm')}Denied</span>`;
    case 'stopped':return `<span class="pill">${icon('stop','sm')}Stopped</span>`;
    default:return `${t.add?`<span class="add">+${t.add}</span>`:''}${t.del?`<span class="del">−${t.del}</span>`:''}${t.matches!=null?`<span>${t.matches} matches</span>`:''}${t.secs>=1?`<span>${fsec(t.secs)}</span>`:''}`;
  }
}
function toolBody(t,live){
  const b=t.body;if(!b)return '';
  if(b.out!==undefined){
    const exit=b.exit!=null?`<span class="${b.exit?'red':'green'}">exit ${b.exit}</span>`:t.status==='running'||t.status==='bg'?'<span class="blue">running</span>':'';
    return `<div class="term"><div class="term-h">${icon('term','sm')}<span>${hl(b.cmd,'sh')}</span><span class="cwd">${esc(b.cwd||'~/vite-project')}</span></div><pre>${b.out}${live?'<span class="caret"></span>':''}</pre><div class="term-f">${exit}${t.secs>=1&&t.status!=='running'?`<span>${fsec(t.secs)}</span>`:''}<span class="sp"></span>${b.lines?`<span>${b.lines}</span>`:''}<button class="ghost">${icon('copy','sm')} Copy</button>${t.status==='bg'?`<button class="ghost red">${icon('stop','sm')} Stop</button>`:''}</div></div>`;
  }
  if(b.diff)return diffView(b.diff,t.id,live);
  if(b.peek)return `<div class="peek">${b.peek.map((l,i)=>`<div class="pl"><span class="ln">${i+1}</span><span>${hl(l,'js')}</span></div>`).join('')}<div class="more">Lines 1–${b.peek.length} of ${b.total} · ${icon('external','sm')} open in editor</div></div>`;
  if(b.matches)return `<div class="matches">${b.matches.map(m=>`<div><b>${esc(m[0])}</b> ${esc(m[1])}</div>`).join('')}</div>`;
  if(b.html)return b.html;
  return '';
}
function toolRow(t,nested){
  const ki=KI[t.kind]||'circle';
  const open=OPEN.has(t.id)||(t.autoOpen&&(t.status==='running'||t.status==='waiting')&&!CLOSED.has(t.id));
  const has=!!t.body;
  return `<div class="row ${t.status}" data-toggle="${has?t.id:''}">${icon(ki,'ki')}<span class="ttl">${esc(t.title)}</span><span class="arg">${esc(t.arg||'')}</span><span class="meta">${statusMeta(t)}${has?icon('chev',open?'rot chev':'chev'):''}</span></div>`
    +(t.status==='failed'&&t.err?`<div class="errline">${esc(t.err)}</div>`:'')
    +(open&&has?`<div class="body">${toolBody(t,t.status==='running'&&t.streaming)}</div>`:'');
}
function readGroup(rs){
  const id='rg'+rs[0].id;const open=OPEN.has(id);
  const names=rs.map(r=>r.arg.split('/').pop());
  return `<div class="row" data-toggle="${id}">${icon('files','ki')}<span class="ttl">Read ${rs.length} files</span><span class="arg">${esc(names.join(', '))}</span><span class="meta">${icon('chev',open?'rot chev':'chev')}</span></div>`
    +(open?`<div class="body" style="margin-top:0">${rs.map(r=>toolRow(r)).join('')}</div>`:'');
}
function thought(b){
  const open=b.live?!CLOSED.has(b.id):OPEN.has(b.id);

const SC_PLAY_NOTE='<b>▶ Live run.</b> One full OpenCode turn, start to finish: startup, thinking, tools, two parallel subagents, an approval that waits on you, a rate-limit retry, a streaming file write, a build and the final answer. Timers are real.';

function load(k){
