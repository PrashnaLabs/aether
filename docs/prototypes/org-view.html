<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE: Aether Organization view</title>
<!--
  PROTOTYPE, throwaway. Question: what should the Organization view look like, and is the
  UI control complete enough that nobody hand-creates head chats?
  Three layouts of the same page (?variant=A|B|C), plus shared pieces every layout uses:
  setup wizard, Settings > Organization, head editor, hire requests, goal composer.
  Top bar switches app state (feature off / no org yet / live org). All state is in memory.
  Data is from the real trial run on 2026-11-12 (cards #1-#6, three gpt-6-luna interns).
-->
<style>
:root{
  --bg:#0d0d0f;--side:#111113;--panel:#151518;--raised:#1b1b1f;--hover:#212126;--line:#25252a;--line2:#33333a;
  --text:#ececef;--dim:#a3a3aa;--muted:#7c7c84;--faint:#55555c;
  --green:#3fb950;--green-bg:rgba(63,185,80,.12);--red:#f85149;--red-bg:rgba(248,81,73,.12);
  --amber:#f5a524;--amber-bg:rgba(245,165,36,.12);--blue:#58a6ff;--blue-bg:rgba(88,166,255,.12);
  --violet:#b18cff;--violet-bg:rgba(177,140,255,.10);
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--text);font:13.5px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;width:100%;font-family:var(--mono);font-size:12px;line-height:1.5}
.mono{font-family:var(--mono)}
.sp{flex:1}.dim{color:var(--muted)}.faint{color:var(--faint)}
.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.blue{color:var(--blue)}.violet{color:var(--violet)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.busy{background:var(--blue)}.dot.wait{background:var(--amber)}.dot.err{background:var(--red)}.dot.ok{background:var(--green)}
.pulse{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
.pill{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--line);color:var(--dim);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill.red{background:var(--red-bg);color:var(--red)}.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.green{background:var(--green-bg);color:var(--green)}.pill.blue{background:var(--blue-bg);color:var(--blue)}.pill.violet{background:var(--violet-bg);color:var(--violet)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:7px;border:1px solid var(--line2);color:var(--dim);font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--hover);color:var(--text)}
.btn.pri{background:var(--text);color:#000;border-color:var(--text)}.btn.pri:hover{background:#fff}
.btn.ok{border-color:rgba(63,185,80,.5);color:var(--green)}.btn.no{border-color:rgba(248,81,73,.4);color:var(--red)}
.btn.sm{padding:2px 8px;font-size:11.5px}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue)}
.bar.warn>i{background:var(--amber)}.bar.over>i{background:var(--red)}
.k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:11px;flex:none;color:#000}
.av.sm{width:22px;height:22px;border-radius:6px;font-size:9.5px}
.av.lg{width:44px;height:44px;border-radius:12px;font-size:14px}
.prov{font-size:11px;color:var(--muted);font-family:var(--mono);white-space:nowrap}

/* prototype state bar (not part of design) */
#proto{position:fixed;top:0;left:0;right:0;height:38px;background:#08080a;border-bottom:1px dashed #3a2a00;z-index:50;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:12px}
#proto .tag{color:#f5a524;font-weight:700;letter-spacing:.06em;margin-right:6px}
.scn{padding:2px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--dim)}
.scn.on{background:var(--text);color:#000;border-color:var(--text)}
#switch{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:4px;background:#f5a524;color:#000;border-radius:99px;padding:4px;box-shadow:0 8px 30px rgba(0,0,0,.6);font-weight:600;font-size:12.5px}
#switch button{width:28px;height:28px;border-radius:50%;font-size:15px}#switch button:hover{background:rgba(0,0,0,.12)}
#switch span{padding:0 10px;min-width:210px;text-align:center}

/* app frame */
#app{position:fixed;top:38px;left:0;right:0;bottom:0;display:grid;grid-template-columns:232px 1fr;grid-template-rows:1fr 26px;background:var(--bg)}
#side{background:var(--side);border-right:1px solid var(--line);padding:12px 8px;overflow:auto;grid-row:1/3}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;padding:2px 8px 14px}
.brand .lg{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#fb7185,#f59e0b)}
.nav{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:7px;color:var(--dim);margin-bottom:1px}
.nav:hover{background:var(--hover)}.nav.cur{background:var(--raised);color:var(--text)}
.nav .n{margin-left:auto;font-size:10.5px;background:var(--amber);color:#000;border-radius:99px;padding:0 6px;font-weight:700}
.nav svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sh{font-size:11.5px;color:var(--muted);padding:14px 9px 6px}
.chat{padding:5px 9px;border-radius:7px;color:var(--dim);font-size:12.5px;display:flex;gap:7px;align-items:center;white-space:nowrap;overflow:hidden}
.chat:hover{background:var(--hover)}
.chat .rb{font-size:9.5px;font-weight:700;padding:0 4px;border-radius:3px;background:var(--violet-bg);color:var(--violet)}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#status{grid-column:2;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 12px;font-size:11.5px;color:var(--muted);background:var(--side)}
#status .org{display:flex;gap:6px;align-items:center;color:var(--dim);cursor:pointer}

/* page header shared by every variant */
.ph{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);flex:none}
.ph h1{font-size:15px;margin:0;font-weight:600}
.ph .proj{font-family:var(--mono);font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{padding:3px 10px;font-size:12px;color:var(--muted)}.seg button.on{background:var(--raised);color:var(--text)}
.goal{display:flex;gap:8px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);flex:none;background:var(--side)}
.goal input{flex:1;background:var(--bg)}
.body{flex:1;min-height:0;display:flex}
.scroll{overflow:auto;min-height:0}

/* inbox items, shared */
.inbox{display:flex;flex-direction:column;gap:8px}
.req{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:10px 12px}
.req .t{display:flex;gap:8px;align-items:center;font-weight:500}
.req .why{color:var(--dim);font-size:12.5px;margin:4px 0 6px}
.checks{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.req .acts{display:flex;gap:6px;flex-wrap:wrap}

/* Variant A: org chart */
.chart{flex:1;padding:28px 20px 90px;display:flex;flex-direction:column;align-items:center;gap:0}
.tier{display:flex;gap:18px;justify-content:center;position:relative}
.node{width:208px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:10px 11px;cursor:pointer;position:relative}
.node:hover{border-color:#4a4a52}.node.sel{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.node .r1{display:flex;gap:9px;align-items:center}
.node .nm{font-weight:600}.node .prov{overflow:hidden;text-overflow:ellipsis;max-width:140px}.node .st{font-size:11.5px;color:var(--dim);margin:7px 0 6px;min-height:34px}
.node .r3{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px}
.wk{display:flex;flex-direction:column;gap:5px;margin-top:10px;align-items:center}
.wchip{width:190px;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;display:flex;gap:6px;align-items:center;cursor:pointer}
.wchip:hover{border-color:var(--line2)}
.wchip .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.conn{width:2px;height:22px;background:var(--line2)}
.hline{height:2px;background:var(--line2);margin:0 auto}
.insp{width:340px;border-left:1px solid var(--line);background:var(--side);padding:16px;overflow:auto;flex:none}
.insp h3{margin:0;font-size:15px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:12.5px;margin:12px 0}
.kv .k{padding-top:2px}
.sec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}

/* Variant B: round table */
.rt{flex:1;display:grid;grid-template-columns:280px 1fr 300px;min-height:0}
.rtcol{border-right:1px solid var(--line);padding:14px;overflow:auto}
.rtcol:last-child{border-right:0;border-left:1px solid var(--line)}
.table{position:relative;margin:auto;width:660px;height:660px}
.board{position:absolute;inset:200px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#1d1d22,#121215);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.board .gl{font-size:12.5px;color:var(--dim);margin:6px 0 10px}
.cols{display:flex;gap:6px}
.cols div{font-size:10.5px;color:var(--muted);text-align:center}
.cols b{display:block;font-size:17px;color:var(--text)}
.seat{position:absolute;width:150px;transform:translate(-50%,-50%);text-align:center;cursor:pointer}
.seat .ring{margin:0 auto 6px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--line2);background:var(--panel)}
.seat .ring.busy{border-color:var(--blue)}.seat .ring.wait{border-color:var(--amber)}.seat .ring.over{border-color:var(--red)}
.seat.sel .ring{box-shadow:0 0 0 4px var(--blue-bg)}
.seat .nm{font-weight:600;font-size:13px}.seat .sub{font-size:11px;color:var(--muted)}
.seat .ws{display:flex;gap:3px;justify-content:center;margin-top:5px}
.seat .ws i{width:9px;height:9px;border-radius:3px;background:var(--violet)}
.seat .ws i.idle{background:var(--line2)}
.msgline{position:absolute;inset:0;pointer-events:none}
.feed{display:flex;flex-direction:column;gap:10px}
.fi{font-size:12.5px;line-height:1.4}
.fi .h{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:2px}
.fi .h b{color:var(--text);font-weight:600}

/* Variant C: roster console */
.con{flex:1;display:grid;grid-template-columns:1fr 330px;min-height:0}
.ros{overflow:auto;padding:4px 0 90px}
.rrow{display:grid;grid-template-columns:24px 190px 1fr 120px 96px 130px 120px 34px;gap:12px;align-items:center;padding:9px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.rrow:hover{background:var(--panel)}.rrow.sel{background:var(--raised)}
.rrow.hd{cursor:default;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--bg);position:sticky;top:0;z-index:1}
.rrow.hd:hover{background:var(--bg)}
.rrow.wrow{padding-left:56px;background:#0f0f11;font-size:12.5px}
.rrow .who{display:flex;gap:9px;align-items:center;min-width:0}
.rrow .who div{min-width:0}.rrow .who .nm{font-weight:600}.rrow .who .prov{overflow:hidden;text-overflow:ellipsis}
.rrow .doing{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side2{border-left:1px solid var(--line);background:var(--side);overflow:auto;padding:14px}
.tabs{display:flex;gap:2px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs button{padding:6px 10px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-color:var(--text)}

/* overlays: drawer, modal */
.scrim{position:fixed;inset:38px 0 0 0;background:rgba(0,0,0,.55);z-index:40;display:flex;justify-content:flex-end}
.scrim.center{justify-content:center;align-items:center}
.drawer{width:520px;height:100%;background:var(--side);border-left:1px solid var(--line2);display:flex;flex-direction:column}
.modal{width:860px;max-height:86vh;background:var(--side);border:1px solid var(--line2);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.modal.sm{width:520px}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:15px}
.mb{padding:16px 18px;overflow:auto;flex:1}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.field{margin-bottom:14px}.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
.field .help{font-size:11.5px;color:var(--muted);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.steps{display:flex;gap:6px;font-size:12px;color:var(--muted)}
.steps span{padding:2px 9px;border-radius:99px;border:1px solid var(--line2)}.steps span.on{color:#000;background:var(--text);border-color:var(--text)}
.steps span.done{color:var(--green);border-color:rgba(63,185,80,.4)}
.tpls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tpl{border:1px solid var(--line2);border-radius:12px;padding:12px;cursor:pointer;background:var(--panel)}
.tpl:hover{border-color:#4a4a52}.tpl.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.tpl h4{margin:0 0 4px;font-size:13.5px}.tpl p{margin:0 0 8px;font-size:12px;color:var(--dim)}
.tpl .avs{display:flex;gap:3px;flex-wrap:wrap}
.staff{display:grid;grid-template-columns:34px 1.1fr 1fr 1.3fr 1fr 90px 28px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.staff.hd{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.staff select,.staff input{width:100%;padding:4px 6px;font-size:12px}
.toggle{width:34px;height:20px;border-radius:99px;background:var(--line2);position:relative;flex:none;cursor:pointer}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--green)}.toggle.on::after{left:17px}
.setrow{display:flex;gap:16px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow .l{flex:1}.setrow .l b{font-weight:500;display:block}.setrow .l span{font-size:12px;color:var(--muted)}
.setnav{width:190px;border-right:1px solid var(--line);padding:12px 8px;flex:none}
.empty{flex:1;display:grid;place-items:center;text-align:center;padding:40px}
.empty .box{max-width:520px}
.empty h2{font-size:20px;margin:14px 0 6px}
.empty p{color:var(--dim);margin:0 0 18px}
.toast{position:fixed;bottom:64px;right:20px;background:var(--raised);border:1px solid var(--line2);border-radius:10px;padding:9px 14px;z-index:70;font-size:12.5px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="proto">
  <span class="tag">PROTOTYPE</span>
  <span class="dim">State:</span>
  <button class="scn" data-s="off">Feature off</button>
  <button class="scn" data-s="empty">No org yet</button>
  <button class="scn" data-s="live">Live org (trial data)</button>
  <span class="sp"></span>
  <span class="dim">Layout switcher at the bottom. ← → keys also work.</span>
</div>
<div id="app">
  <aside id="side"></aside>
  <main id="main"></main>
  <footer id="status"></footer>
</div>
<div id="switch"><button id="prev">‹</button><span id="vlabel"></span><button id="next">›</button></div>
<div id="overlay"></div>

<script>
const COLORS={CEO:'#f5a524',ENG:'#58a6ff',PRODUCT:'#b18cff',SEC:'#f85149',DESIGN:'#ff7ab6',QA:'#3fb950',OPS:'#2dd4bf',MKT:'#fb923c'};
const MODELS={
  claude:['sonnet','opus','haiku','fable'],
  codex:['gpt-6.1-sol','gpt-6.1-terra','gpt-6-luna'],
  antigravity:['gemini-3.8-flash-high','gemini-4-argon-high','claude-sonnet-5-5-high'],
  opencode:['google/gemini-3.8-flash','opencode/claude-sonnet-5-5'],
  pi:['opencode/claude-haiku-5-5','opencode/gemini-3.8-flash'],
};
const TEMPLATES=[
  {id:'solo',name:'Solo builder',desc:'A planner and one engineering head. Cheapest; good for small repos.',roles:['CEO','ENG']},
  {id:'startup',name:'Startup',desc:'Engineering, product and security heads. What the 2026-11-12 trial ran.',roles:['CEO','ENG','PRODUCT','SEC'],rec:true},
  {id:'company',name:'Full company',desc:'Adds design, QA, release ops and marketing. Expensive; merge roles you do not need.',roles:['CEO','ENG','PRODUCT','SEC','DESIGN','QA','OPS','MKT']},
  {id:'custom',name:'Custom',desc:'Start from just a CEO and add heads yourself.',roles:['CEO']},
];
const ROLE_DEF={
  CEO:{title:'CEO',owns:'Intake, routing, roster, hiring gate, status to you',prov:'claude',model:'sonnet',budget:5,review:'You'},
  ENG:{title:'Engineering',owns:'Design, implementation through workers, code review',prov:'codex',model:'gpt-6.1-sol',budget:10,review:'SEC'},
  PRODUCT:{title:'Product',owns:'Requirements, acceptance criteria, docs, release notes',prov:'antigravity',model:'gemini-3.8-flash-high',budget:3,review:'ENG'},
  SEC:{title:'Security',owns:'Threat review, release gate',prov:'claude',model:'opus',budget:8,review:'ENG'},
  DESIGN:{title:'Design',owns:'UI specs, prototypes, UX review',prov:'claude',model:'sonnet',budget:4,review:'PRODUCT'},
  QA:{title:'QA',owns:'Test plans, regression runs, bug triage',prov:'codex',model:'gpt-6-luna',budget:3,review:'ENG'},
  OPS:{title:'Release ops',owns:'Builds, packaging, CI, release checklist',prov:'codex',model:'gpt-6.1-terra',budget:3,review:'SEC'},
  MKT:{title:'Marketing',owns:'Website, launch copy, changelog voice',prov:'antigravity',model:'gemini-3.8-flash-high',budget:2,review:'PRODUCT'},
};

function liveOrg(){
  return {
    heads:[
      {id:'CEO',status:'wait',doing:'Waiting on SEC verdict for #5',spend:0.94,est:false,ctx:38,cards:[],chat:1794489378137},
      {id:'ENG',status:'busy',doing:'Reviewing M1 rework from worker (round 2)',spend:4.10,est:true,ctx:71,cards:[2,4,5],chat:1794489378201},
      {id:'PRODUCT',status:'idle',doing:'#1 approved; idle',spend:0.31,est:true,ctx:22,cards:[1],chat:1794489378202},
      {id:'SEC',status:'busy',doing:'Final diff review on #5',spend:6.79,est:false,ctx:54,cards:[3],chat:1794489378203},
    ].map(h=>({...ROLE_DEF[h.id],...h,persona:personaFor(h.id),maxWorkers:2})),
    workers:[
      {id:'w1',boss:'ENG',title:'H1 token transport fix',model:'codex / gpt-6-luna',card:4,status:'idle',state:'In review',rounds:1,spend:0.42},
      {id:'w2',boss:'ENG',title:'M1 sender tag and ownership fix',model:'codex / gpt-6-luna',card:5,status:'busy',state:'Rework, round 2',rounds:2,spend:0.66},
      {id:'w3',boss:'ENG',title:'M1 adversarial regression tests',model:'codex / gpt-6-luna',card:5,status:'idle',state:'Done',rounds:1,spend:0.18},
    ],
    requests:[
      {id:'r1',kind:'hire',from:'ENG',title:'Hire a worker for #6 (sender provenance)',why:'Per-target guard and from_agent provenance; split from #5.',model:'codex / gpt-6-luna',checks:[['Has card #6',1],['ENG at 3 of 2 workers',0],['Org pool 1/3 busy',1],['Budget left $5.90',1]],verdict:'Rule says: deny. Approving raises ENG to 4 workers for this card.'},
      {id:'r2',kind:'decide',from:'SEC',title:'Accept: CEO can no longer rename or pin heads',why:'Side effect of the M1 fix restricting update_chat to own chat and children. Needs your product call.',checks:[],verdict:'Escalated to you'},
      {id:'r3',kind:'hire',from:'PRODUCT',title:'Hire a worker for release notes',why:'Draft changelog for #1 to #5 while ENG finishes.',model:'claude / haiku',checks:[['No card yet',0],['Product at 0 of 2',1],['Org pool 1/3',1],['Budget',1]],verdict:'Rule says: deny until a card exists. Approve creates one.'},
    ],
    feed:[
      ['ENG','SEC','#5 ready for final SEC diff review. Gates pass: focused 10+1, full app 895, clippy, fmt.','2m'],
      ['PRODUCT','CEO','Card #1 accuracy recheck APPROVED by ENG. Docs updated, uncommitted.','6m'],

function decide(id,how){

    <p class="dim" style="font-size:12.5px;margin-top:14px">Research note: every head adds coordination cost. Start small; the CEO will tell you when a head is overloaded.</p>`;
  if(w.step===1){if(!w.staff)wizStaff();body=`<div class="staff hd"><span></span><span>Role</span><span>Provider</span><span>Model</span><span>Reviewed by</span><span>Budget/day</span><span></span></div>`+
    w.staff.map((s,i)=>`<div class="staff">${av(s.id,'sm')}<input value="${esc(s.title)}"><select onchange="S.wiz.staff[${i}].prov=this.value;S.wiz.staff[${i}].model=MODELS[this.value][0];render()">${Object.keys(MODELS).map(p=>`<option ${p===s.prov?'selected':''}>${p}</option>`).join('')}</select><select>${MODELS[s.prov].map(m=>`<option ${m===s.model?'selected':''}>${m}</option>`).join('')}</select><select>${['You',...w.staff.map(x=>x.id)].filter(x=>x!==s.id).map(r=>`<option ${r===s.review?'selected':''}>${r}</option>`).join('')}</select><input value="$${s.budget}"><button class="btn sm" title="Remove" onclick="S.wiz.staff.splice(${i},1);render()" ${s.id==='CEO'?'disabled style="opacity:.3"':''}>✕</button></div>`).join('')+
    `<div style="display:flex;gap:8px;margin-top:10px"><select id="addrole">${Object.keys(ROLE_DEF).filter(r=>!w.staff.some(s=>s.id===r)).map(r=>`<option value="${r}">${ROLE_DEF[r].title}</option>`).join('')}</select><button class="btn sm" onclick="const r=$('#addrole').value;if(r){S.wiz.staff.push({id:r,...ROLE_DEF[r]});render()}">+ Add head</button><span class="sp"></span><span class="dim" style="font-size:12px">Tip: pick a reviewer from a different vendor than the author.</span></div>
    <div class="field" style="margin-top:14px"><label>Merge roles</label><div class="help">Drag one head onto another to merge them into one chat with both role files (for example Product + Marketing).</div></div>`}
  if(w.step===2)body=policyFields(w.pol,'S.wiz.pol');
  if(w.step===3){const st=w.staff||(wizStaff(),w.staff);body=`<p>Aether will:</p><ul style="color:var(--dim);line-height:1.8;margin-top:0">
    <li>Create <b style="color:var(--text)">${st.length} pinned lead chats</b> in this project: ${st.map(s=>s.title).join(', ')}.</li>
    <li>Write role files and a roster to <span class="mono">~/.config/aether/org/aether/</span>.</li>
    <li>Label review routing on the board: ${st.filter(s=>s.id!=='CEO').map(s=>`${s.title} → ${s.review}`).join(', ')}.</li>
    <li>Cap workers at ${w.pol.pool==='auto'?3:w.pol.poolN} org-wide, ${w.pol.perHead} per head, ${w.pol.builds} build at a time.</li>
    <li>Start the CEO. It reads the roster and greets each head. Nothing else runs until you give a goal.</li></ul>
    <div class="field"><label>First goal (optional)</label><input style="width:100%" placeholder="e.g. Fix the flaky worktree tests and document the fix"></div>`}
  return `<div class="scrim center"><div class="modal"><div class="mh"><h2>Set up organization</h2><span class="sp"></span><div class="steps">${steps.map((s,i)=>`<span class="${i===w.step?'on':i<w.step?'done':''}">${i+1} ${s}</span>`).join('')}</div></div>
   <div class="mb">${body}</div>
   <div class="mf"><button class="btn" onclick="S.overlay=null;render()">Cancel</button><span class="sp"></span>${w.step?`<button class="btn" onclick="S.wiz.step--;render()">Back</button>`:''}${w.step<3?`<button class="btn pri" onclick="S.wiz.step++;render()">Next</button>`:`<button class="btn pri" onclick="createOrg()">Create organization</button>`}</div></div></div>`;
}
function createOrg(){
  const st=S.wiz.staff;Object.assign(S.settings,S.wiz.pol);
  S.org={heads:st.map(s=>({...s,status:s.id==='CEO'?'busy':'idle',doing:s.id==='CEO'?'Greeting heads':'Waiting for the CEO',spend:0,est:false,ctx:2,cards:[],persona:personaFor(s.id),maxWorkers:S.settings.perHead})),workers:[],requests:[],feed:[['CEO','ENG','Welcome. Read your role file; reply ready.','now']],board:{backlog:0,todo:0,doing:0,review:0,done:0},goal:'No goal yet. Give the org one above.'};
  S.state='live';S.overlay=null;S.sel='CEO';toast(`Created ${st.length} heads. The CEO is greeting them.`);sync();
}

/* ---------- settings (shared) ---------- */
function policyFields(p,path){
  const sel=(k,opts)=>`<select onchange="${path}.${k}=this.value;render()">${opts.map(([v,l])=>`<option value="${v}" ${p[k]==v?'selected':''}>${l}</option>`).join('')}</select>`;
  return `<div class="row2"><div class="field"><label>Worker pool</label>${sel('pool',[['auto','Auto from machine (3 on 8 cores, 16 GB)'],['manual','Manual']])}${p.pool==='manual'?` <input type="number" value="${p.poolN}" style="width:70px" onchange="${path}.poolN=+this.value">`:''}<div class="help">Most workers running at once across every head.</div></div>
   <div class="field"><label>Builds at a time</label><input type="number" value="${p.builds}" style="width:80px" onchange="${path}.builds=+this.value"><div class="help">cargo/npm builds are serialized; shared target dirs clobber when parallel.</div></div></div>
   <div class="row2"><div class="field"><label>Workers per head</label><input type="number" value="${p.perHead}" style="width:80px" onchange="${path}.perHead=+this.value"></div>
   <div class="field"><label>Hiring beyond the per-head cap</label>${sel('hire',[['rules','CEO decides by rules (no vote)'],['auto','Auto-approve when every rule passes'],['ask','Always ask me']])}<div class="help">Rules: has a card, pool has a slot, head under budget.</div></div></div>
   <div class="row2"><div class="field"><label>Org budget per day</label><input value="$${p.budget}" style="width:90px"><div class="help">Heads pause and ask you at 100%.</div></div>
   <div class="field"><label>Rotate a head's session at</label><input type="number" value="${p.rotate}" style="width:70px" onchange="${path}.rotate=+this.value"> % context<div class="help">Head writes its memory file, then starts fresh with the same role.</div></div></div>
   <div class="row2"><div class="field"><label>Loop guard</label><input type="number" value="${p.guard}" style="width:70px"> messages in a row from one sender</div>
   <div class="field"><label>Review gate</label>${sel('gate',[['tests','Tests and lint must pass before a head reviews'],['none','Heads review any time']])}</div></div>`;
}
function openSettings(){S.overlay='settings';render()}
function settings(){
  const s=S.settings;
  const row=(title,sub,ctl)=>`<div class="setrow"><div class="l"><b>${title}</b><span>${sub}</span></div>${ctl}</div>`;
  return `<div class="scrim center"><div class="modal" style="width:940px;height:80vh"><div class="mh"><h2>Settings</h2><span class="sp"></span><button class="btn sm" onclick="S.overlay=null;render()">Close</button></div>
   <div style="display:flex;flex:1;min-height:0"><div class="setnav">${['General','Appearance','Agents','Orchestration','Organization','Usage','Shortcuts'].map(n=>`<div class="nav ${n==='Organization'?'cur':''}">${n}</div>`).join('')}</div>
   <div class="mb">
    ${row('Enable organizations','Shows the Organization view, sidebar section and status bar item. Turning it off pauses every org; nothing is deleted.',`<div class="toggle ${S.enabled?'on':''}" onclick="S.enabled=!S.enabled;S.state=S.enabled?(S.org?'live':'empty'):'off';if(!S.enabled)S.org=null;render()"></div>`)}
    ${S.enabled?`
    ${row('Where org files live','Role files, memory and roster. One org per project, stored outside the repo.',`<select><option>~/.config/aether/org/&lt;project&gt;</option><option>.aether/org in the repo</option></select>`)}
    ${row('Default template','Used by Set up organization.',`<select>${TEMPLATES.map(t=>`<option ${t.id==='startup'?'selected':''}>${t.name}</option>`).join('')}</select>`)}
    ${row('Show heads in the sidebar','A section above Chats with each head and its status.',`<div class="toggle ${s.sidebar?'on':''}" onclick="S.settings.sidebar=!S.settings.sidebar;render()"></div>`)}
    ${row('Notify me when the org needs a decision','Hiring outside the rules, escalations, budget at 100%.',`<div class="toggle ${s.notify?'on':''}" onclick="S.settings.notify=!S.settings.notify;render()"></div>`)}
    <h3 style="font-size:13px;margin:18px 0 10px">Default rules for new organizations</h3>${policyFields(s,'S.settings')}`:''}
   </div></div></div></div>`;
}

/* ---------- head editor drawer (shared) ---------- */
function openHead(id){S.sel=id;S.overlay='head';render()}
function openAddHead(){const free=Object.keys(ROLE_DEF).find(r=>!S.org.heads.some(h=>h.id===r));if(!free)return toast('Every role is filled.');S.org.heads.push({...ROLE_DEF[free],id:free,status:'idle',doing:'New: waiting for the CEO',spend:0,est:false,ctx:0,cards:[],persona:personaFor(free),maxWorkers:S.settings.perHead});S.sel=free;S.overlay='head';render()}
function headDrawer(){
  const h=head(S.sel);if(!h){S.overlay=null;return ''}
  return `<div class="scrim" onclick="if(event.target===this){S.overlay=null;render()}"><div class="drawer"><div class="mh">${av(h.id)}<div><h2>${h.title}</h2><div class="prov">chat #${h.chat||'new'} · pinned lead</div></div><span class="sp"></span><button class="btn sm" onclick="S.overlay=null;render()">Close</button></div>
   <div class="mb">
    <div class="row2"><div class="field"><label>Title</label><input style="width:100%" value="${esc(h.title)}"></div>
    <div class="field"><label>Reviewed by</label><select style="width:100%">${['You',...S.org.heads.map(x=>x.id)].filter(x=>x!==h.id).map(r=>`<option ${r===h.review?'selected':''}>${r}</option>`).join('')}</select></div></div>
    <div class="row2"><div class="field"><label>Provider</label><select style="width:100%" onchange="head('${h.id}').prov=this.value;head('${h.id}').model=MODELS[this.value][0];render()">${Object.keys(MODELS).map(p=>`<option ${p===h.prov?'selected':''}>${p}</option>`).join('')}</select></div>
    <div class="field"><label>Model <span class="pill violet">pinned</span></label><select style="width:100%" onchange="head('${h.id}').model=this.value;render()">${MODELS[h.prov].map(m=>`<option ${m===h.model?'selected':''}>${m}</option>`).join('')}</select><div class="help">Changing it hands the session off; the role and memory carry over.</div></div></div>
    <div class="row2"><div class="field"><label>Budget per day</label><input value="$${h.budget}" style="width:100%"></div><div class="field"><label>Max workers</label><input type="number" value="${h.maxWorkers}" style="width:100%"></div></div>
    <div class="field"><label>Owns</label><input style="width:100%" value="${esc(h.owns)}"></div>
    <div class="field"><label>Role file (persona) <span class="dim">~/.config/aether/org/aether/roles/${h.id.toLowerCase()}.md</span></label><textarea rows="10">${esc(h.persona)}</textarea><div class="help">Sent at the start of every fresh session, so it survives rotation and handoff.</div></div>
    <div class="field"><label>Memory <span class="dim">written by the head</span></label><textarea rows="5" readonly>- 2026-11-12: #2 shipped via shared chat_spend; footer unchanged.\n- Guard is per sender since 7856c9d; card notes do not wake anyone, message the owner.\n- Workers share CARGO_TARGET_DIR=/tmp/aether-trial/target, one build at a time.</textarea></div>
   </div>
   <div class="mf"><button class="btn no" onclick="S.org.heads=S.org.heads.filter(x=>x.id!=='${h.id}');S.overlay=null;S.sel='CEO';toast('Head removed. Its chat is archived, cards return to the CEO.');render()" ${h.id==='CEO'?'disabled style="opacity:.3"':''}>Remove head</button><button class="btn" onclick="rotate('${h.id}')">Rotate session</button><span class="sp"></span><button class="btn">Open chat</button><button class="btn pri" onclick="S.overlay=null;toast('Saved.');render()">Save</button></div></div></div>`;
}

/* ---------- hire dialog (shared) ---------- */
function openHire(){S.overlay='hire';render()}
function hireDialog(){
  const free=poolCap()-busyWorkers();
  return `<div class="scrim center"><div class="modal sm"><div class="mh"><h2>Hire a worker</h2></div><div class="mb">
   <div class="row2"><div class="field"><label>For head</label><select id="hb" style="width:100%">${S.org.heads.filter(h=>h.id!=='CEO').map(h=>`<option value="${h.id}">${h.title}</option>`).join('')}</select></div>
   <div class="field"><label>Card</label><select style="width:100%"><option>#6 Fix: guard provenance</option><option>New card…</option></select></div></div>
   <div class="field"><label>Model</label><select id="hm" style="width:100%"><option>codex / gpt-6-luna</option><option>claude / haiku</option><option>pi / opencode/claude-haiku-5-5</option></select><div class="help">Interns use the cheap tier. Their work is reviewed by the head, then the head's reviewer.</div></div>
   <div class="field"><label>Task</label><textarea rows="3" style="font-family:var(--sans)">Add from_agent provenance to queued messages; guard counts per target id. Acceptance: tests for rename and forged tag.</textarea></div>
   <label style="display:flex;gap:8px;align-items:center;font-size:12.5px"><input type="checkbox" checked> Own worktree</label>
   <div class="checks" style="margin-top:12px"><span class="pill ${free>0?'green':'red'}">${free>0?'✓':'✗'} Pool ${busyWorkers()}/${poolCap()}</span><span class="pill green">✓ Has card</span><span class="pill green">✓ Budget</span></div>
   </div><div class="mf"><button class="btn" onclick="S.overlay=null;render()">Cancel</button><button class="btn pri" onclick="S.org.workers.push({id:'w'+Date.now(),boss:$('#hb').value,title:'Guard provenance',model:$('#hm').value,card:6,status:${free>0?"'busy'":"'idle'"},state:'${free>0?'Starting':'Queued'}',rounds:0,spend:0});S.overlay=null;toast('${free>0?'Worker started.':'Pool full: queued, starts when a slot frees.'}');render()">${free>0?'Hire':'Queue hire'}</button></div></div></div>`;
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('.scn').forEach(b=>b.classList.toggle('on',b.dataset.s===S.state));
  $('#vlabel').textContent=`${S.variant} · ${VARIANTS[S.variant]}`;
  sidebar();
  const m=$('#main');
  if(!S.enabled)m.innerHTML=offState();
  else if(!S.org)m.innerHTML=emptyState();
  else m.innerHTML={A:variantA,B:variantB,C:variantC}[S.variant]();
  $('#overlay').innerHTML=S.overlay==='wizard'?wizard():S.overlay==='settings'?settings():S.overlay==='head'&&S.org?headDrawer():S.overlay==='hire'&&S.org?hireDialog():'';
}
function cycle(d){const k=Object.keys(VARIANTS);S.variant=k[(k.indexOf(S.variant)+d+k.length)%k.length];sync()}
$('#prev').onclick=()=>cycle(-1);$('#next').onclick=()=>cycle(1);
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1);if(e.key==='Escape'&&S.overlay){S.overlay=null;render()}});
document.querySelectorAll('.scn').forEach(b=>b.onclick=()=>setState(b.dataset.s));
setInterval(()=>{if(!S.org||S.overlay)return;const h=S.org.heads.find(x=>x.status==='busy');if(h){h.spend+=0.01;h.ctx=Math.min(99,h.ctx+(Math.random()<.3?1:0));render()}},4000);
setState(S.state);
{const o=new URLSearchParams(location.search).get('open');if(o==='wizard'){openWizard();S.wiz.step=+(new URLSearchParams(location.search).get('step')||0);render()}else if(o)openSettings()}
</script>
</body>
</html>
